
name: Radar Diario Clik Brenner

on:
  workflow_dispatch:
  schedule:
    - cron: '31 1 * * *'

permissions:
  contents: write

concurrency:
  group: radar-diario
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Coletar oportunidades esportivas
        run: python scripts/coletar_radar.py
